name: PR Gate

# This gate validates that no high or critical advisories affect our npm dependencies.
# The Docker image is built and scanned by the Security workflow.

on:
  pull_request:
    branches: ["main"]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.Js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Audit dependencies
        run: corepack enable && yarn npm audit --all --recursive --severity high
