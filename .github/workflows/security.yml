name: Security

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DT_URL: https://api.dependency-track.explore.de
  DT_NPM_PROJECT: explore/sherlock
  DT_IMAGE_PROJECT: ghcr.io/explore-de/sherlock
  DT_PROJECT_TAGS: sherlock

jobs:
  ci-script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Test CI scripts
        run: node --test 'scripts/ci/*.test.mjs'

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sherlock:ci

      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sherlock:ci
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Upload image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sbom
          path: image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Scan image SBOM
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: image-sbom.cdx.json
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: sarif

      # Fork PRs get a read-only token, so code scanning uploads are only possible for same-repo refs.
      - name: Upload scan results to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-scan

  dependency-track:
    needs: [ci-script-tests, image-scan]
    # Publish even when the vulnerability gate failed: Dependency-Track must see what main actually ships.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci-script-tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download image SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-sbom

      - name: Generate npm SBOM
        run: npx --yes @cyclonedx/cdxgen@12.8.4 -t js --no-install-deps --spec-version 1.6 --exclude 'vendor/**' -o npm-sbom.cdx.json .

      - name: Resolve project version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish SBOMs to Dependency-Track
        env:
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [ -z "$DT_API_KEY" ]; then
            echo "::error::Repository secret DT_API_KEY is not configured"
            exit 1
          fi
          publish() {
            curl --silent --show-error --fail-with-body \
              --retry 3 --retry-all-errors --retry-delay 10 \
              --connect-timeout 10 --max-time 120 \
              -X POST "$DT_URL/api/v1/bom" \
              -H "X-Api-Key: $DT_API_KEY" \
              -F "autoCreate=true" \
              -F "projectName=$1" \
              -F "projectVersion=$VERSION" \
              -F "projectTags=$DT_PROJECT_TAGS" \
              -F "isLatest=true" \
              -F "bom=@$2"
            echo
          }
          publish "$DT_NPM_PROJECT" npm-sbom.cdx.json
          publish "$DT_IMAGE_PROJECT" image-sbom.cdx.json

      # Keep the current version plus the most recent release active, so the version deployed
      # from the last tag stays monitored while main keeps publishing dev-<run> versions.
      - name: Clean up old Dependency-Track versions
        env:
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          node scripts/ci/dtrack-version-cleanup.mjs --url "$DT_URL" --project "$DT_NPM_PROJECT" --version "$VERSION" --keep-tags 1
          node scripts/ci/dtrack-version-cleanup.mjs --url "$DT_URL" --project "$DT_IMAGE_PROJECT" --version "$VERSION" --keep-tags 1
