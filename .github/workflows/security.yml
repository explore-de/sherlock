name: Security

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  # Rescan main daily so vulnerabilities disclosed after the last push still raise alerts.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sherlock:ci

      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sherlock:ci
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Upload image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sbom
          path: image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate dependency snapshot
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sherlock:ci
          format: github-json
          output-file: dependency-snapshot.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Upload dependency snapshot
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-snapshot
          path: dependency-snapshot.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan image SBOM
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: image-sbom.cdx.json
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: sarif

      # Fork PRs get a read-only token, so code scanning uploads are only possible for same-repo refs.
      - name: Upload scan results to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-scan

  # Kept out of image-scan so the write token that the dependency submission API needs
  # is never minted for pull request runs.
  dependency-snapshot:
    needs: image-scan
    # Submit even when the vulnerability gate failed: the dependency graph must reflect what main ships.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dependency snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-snapshot

      - name: Submit image dependencies to the dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg id "$GITHUB_RUN_ID" \
            '.sha = $sha | .ref = $ref | .job = {correlator: "security_image-dependencies", id: $id}' \
            dependency-snapshot.json > snapshot.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input snapshot.json
