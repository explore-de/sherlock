name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Allow one deployment at a time, but let an in-progress one finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The site is static; the build verifies it and packages it for Pages.
      - name: Check local references
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          root = pathlib.Path("site")
          missing = []
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              for ref in re.findall(r'(?:href|src|srcset)="([^"]+)"', html):
                  if re.match(r"^(?:[a-z]+:|//|#)", ref):
                      continue
                  path = ref.split("#")[0].split("?")[0]
                  target = (page.parent / path) if path else page
                  if target.is_dir():
                      target = target / "index.html"
                  if not target.exists():
                      missing.append(f"{page}: {ref}")
          for css in root.rglob("*.css"):
              for ref in re.findall(r'url\("?([^")]+)"?\)', css.read_text(encoding="utf-8")):
                  if not re.match(r"^(?:[a-z]+:|//|#)", ref) and not (css.parent / ref).exists():
                      missing.append(f"{css}: {ref}")
          if missing:
              print("Missing files:\n" + "\n".join(missing))
              sys.exit(1)
          print("All local references resolve.")
          EOF

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
